<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>RPG Chess - 통합 버전</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .hidden { display: none !important; }
        button { background: #7f8c8d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin: 5px; }
        .board { display: grid; grid-template-columns: repeat(8, 65px); grid-template-rows: repeat(8, 65px); border: 5px solid #444; margin: 20px auto; }
        .cell { width: 65px; height: 65px; border: 1px solid #555; }
    </style>
</head>
<body>

    <div id="lobby">
        <h2>RPG CHESS LOBBY</h2>
        <button id="btn-create">방 만들기</button>
        <button id="btn-deck-open">덱 수정하기</button>
        <input type="text" id="room-input" placeholder="방 코드 입력">
        <button id="btn-join">방 참가하기</button>
    </div>

    <div id="deck-editor" class="hidden">
        <div id="deck-slots"></div>
        <div id="pool-list"></div>
        <button id="btn-deck-save">저장 후 로비로</button>
    </div>

    <div id="game-container" class="hidden">
        <h3 id="turn-display">상대방 대기 중...</h3>
        <div class="board" id="chess-board"></div>
        <button id="btn-mode-move">이동</button>
        <button id="btn-mode-attack">공격</button>
        <button id="btn-end-turn">턴 종료</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myDeck = ['Pawn', 'Mercenary', 'Assassin', 'Berserker', 'RushWarrior', 'Apprentice'];
        const lobby = document.getElementById('lobby');
        const deckEditor = document.getElementById('deck-editor');
        const gameContainer = document.getElementById('game-container');

        // [방 기능 복원]
        document.getElementById('btn-create').onclick = () => socket.emit('createRoom', { customDeck: myDeck });
        document.getElementById('btn-join').onclick = () => {
            const code = document.getElementById('room-input').value;
            socket.emit('joinRoom', { roomId: code, customDeck: myDeck });
        };

        // [방 생성/참가 이벤트 처리]
        socket.on('roomCreated', ({ roomId }) => alert('방 생성 완료! 코드: ' + roomId));
        socket.on('gameStarted', ({ roomId }) => {
            lobby.classList.add('hidden');
            gameContainer.classList.remove('hidden');
        });

        // [덱 수정 기능 복원]
        document.getElementById('btn-deck-open').onclick = () => { lobby.classList.add('hidden'); deckEditor.classList.remove('hidden'); };
        document.getElementById('btn-deck-save').onclick = () => { deckEditor.classList.add('hidden'); lobby.classList.remove('hidden'); };

        // [게임 핵심 로직 (서버 데이터 기반)]
        socket.on('actionProcessed', ({ board, rushMoveLeft, rushAttackLeft }) => {
            // 보드 업데이트
            // btnModeMove.disabled = (rushMoveLeft <= 0);
            // btnModeAttack.disabled = (rushAttackLeft <= 0);
            
            // 모든 기회 소진 시 자동 턴 종료 유도
            if (rushMoveLeft <= 0 && rushAttackLeft <= 0) {
                socket.emit('endTurn', currentRoomId);
            }
        });
    </script>
</body>
</html>
